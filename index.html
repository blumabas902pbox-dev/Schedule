<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Schedule</title>

  <!-- Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- html2pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* ===================================================
       THEME PALETTES (Balanced Light/Dark/Shades)
       =================================================== */

    /* 1. LIGHT */
    :root[data-theme="light"] {
      --bg: #ffffff;
      --grid-line: rgba(0, 102, 204, 0.08);
      --card-bg: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #1e3a8a;
      --border-color: #cbd5e1;
      --primary: #1d4ed8;
      --secondary: #1e3a8a;
      --glow-color: rgba(29, 78, 216, 0.45);
      --btn-save-bg: #1d4ed8;
      --btn-save-text: #ffffff;
      --lightest: #ffffff;
      --normal: #1d4ed8;
      --darker: #1e3a8a;
      --darkest: #0f172a;
    }

    /* 2. DARK */
    :root[data-theme="dark"] {
      --bg: #000000;
      --grid-line: rgba(255, 255, 255, 0.06);
      --card-bg: #111111;
      --text-main: #f8fafc;
      --text-muted: #e2e8f0;
      --border-color: #333333;
      --primary: #9ca3af;
      --secondary: #ffffff;
      --glow-color: rgba(255, 255, 255, 0.35);
      --btn-save-bg: #e2e8f0;
      --btn-save-text: #000000;
      --lightest: #ffffff;
      --normal: #9ca3af;
      --darker: #4b5563;
      --darkest: #111111;
    }

    /* 3. PARTY */
    :root[data-theme="party"] {
      --bg: #0f0d1a;
      --card-bg: #181528;
      --text-main: #f43f5e;
      --text-muted: #38bdf8;
      --border-color: #a855f7;
      --primary: #facc15;
      --secondary: #4ade80;
      --glow-color: rgba(168, 85, 247, 0.6);
      --btn-save-bg: #4ade80;
      --btn-save-text: #0f0d1a;
      --lightest: #fef08a;
      --normal: #facc15;
      --darker: #ca8a04;
      --darkest: #713f12;
    }

    /* 4. EARTHLINGS */
    :root[data-theme="earthlings"] {
      --bg: #1c140d;
      --card-bg: #2a1f16;
      --text-main: #CAB266;
      --text-muted: #c5b58e;
      --border-color: #4a4036;
      --primary: #8f967a;
      --secondary: #CAB266;
      --glow-color: rgba(143, 150, 122, 0.5);
      --btn-save-bg: #CAB266;
      --btn-save-text: #1c140d;
      --lightest: #eadeb8;
      --normal: #8f967a;
      --darker: #595e4a;
      --darkest: #2a1f16;
    }

    /* 5. MATRIX */
    :root[data-theme="matrix"] {
      --bg: #020b04;
      --grid-line: rgba(34, 197, 94, 0.08);
      --card-bg: #08160a;
      --text-main: #22c55e;
      --text-muted: #86efac;
      --border-color: #15803d;
      --primary: #16a34a;
      --secondary: #14532d;
      --glow-color: rgba(34, 197, 94, 0.6);
      --btn-save-bg: #22c55e;
      --btn-save-text: #020b04;
      --lightest: #dcfce7;
      --normal: #22c55e;
      --darker: #15803d;
      --darkest: #052e16;
    }

    /* 6. SYNTHWAVE */
    :root[data-theme="synthwave"] {
      --bg: #1a0b1c; 
      --grid-line: rgba(168, 85, 247, 0.1);
      --card-bg: #2c122e;
      --text-main: #f3e8ff; 
      --text-muted: #e879f9;
      --border-color: #7e22ce;
      --primary: #a855f7;
      --secondary: #9333ea;
      --glow-color: rgba(168, 85, 247, 0.6);
      --btn-save-bg: #a855f7;
      --btn-save-text: #ffffff;
      --lightest: #faf5ff;
      --normal: #c084fc;
      --darker: #7e22ce;
      --darkest: #3b0764;
    }

    /* 7. NORDIC */
    :root[data-theme="nordic"] {
      --bg: #0b1329;
      --card-bg: #132247;
      --text-main: #f8fafc;
      --text-muted: #93c5fd;
      --border-color: #1d4ed8;
      --primary: #3b82f6;
      --secondary: #2563eb;
      --glow-color: rgba(96, 165, 250, 0.55);
      --btn-save-bg: #3b82f6;
      --btn-save-text: #ffffff;
      --lightest: #eff6ff;
      --normal: #60a5fa;
      --darker: #1d4ed8;
      --darkest: #1e3a8a;
    }

    /* 8. LOVE */
    :root[data-theme="love"] {
      --bg: #1a0307;
      --card-bg: #2a060c;
      --text-main: #fff1f2;
      --text-muted: #fca5a5;
      --border-color: #991b1b;
      --primary: #ef4444;
      --secondary: #dc2626;
      --glow-color: rgba(239, 68, 68, 0.6);
      --btn-save-bg: #ef4444;
      --btn-save-text: #ffffff;
      --lightest: #ffe4e6;
      --normal: #f87171;
      --darker: #b91c1c;
      --darkest: #450a0a;
    }

    /* 9. BUBBLY */
    :root[data-theme="bubbly"] {
      --bg: #240a17;
      --card-bg: #381024;
      --text-main: #fdf2f8;
      --text-muted: #f472b6;
      --border-color: #db2777;
      --primary: #ec4899;
      --secondary: #be185d;
      --glow-color: rgba(236, 72, 153, 0.6);
      --btn-save-bg: #ec4899;
      --btn-save-text: #ffffff;
      --lightest: #fce7f3;
      --normal: #f472b6;
      --darker: #be185d;
      --darkest: #500724;
    }

    /* 10. TRICOLOUR */
    :root[data-theme="tricolour"] {
      --bg: #180e08;
      --card-bg: #26170d;
      --text-main: #fef3c7;
      --text-muted: #e2e8f0;
      --border-color: #8c4a19;
      --primary: #cd7f32;
      --secondary: #cbd5e1;
      --glow-color: rgba(205, 127, 50, 0.6);
      --btn-save-bg: #cd7f32;
      --btn-save-text: #ffffff;
      --lightest: #fffbeb;
      --normal: #f59e0b;
      --darker: #b45309;
      --darkest: #451a03;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    #nodeCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: auto;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1650px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding: 1.25rem;
      background-color: var(--card-bg);
      border-radius: 16px;
      border: 2px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .brand {
      flex: 1 1 300px;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
      word-break: break-word;
    }

    /* Semester Countdown & Config widget inside Names header */
    .semester-sync-widget {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-top: 8px;
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      background: rgba(0,0,0,0.12);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px dashed var(--border-color);
    }
    .semester-sync-widget input[type="date"] {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 4px;
      font-family: inherit;
      font-size: 0.75rem;
    }
    .countdown-display {
      font-weight: 700;
      color: var(--primary);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      flex: 1 1 auto;
      justify-content: flex-end;
    }

    .btn, select {
      padding: 0.6rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: 2px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-family: inherit;
    }

    .btn:hover, select:hover, .btn:focus-visible, select:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--glow-color);
      outline: none;
    }

    .btn-save {
      background-color: var(--btn-save-bg) !important;
      color: var(--btn-save-text) !important;
      border-color: var(--btn-save-bg) !important;
      font-weight: 800;
      box-shadow: 0 2px 10px var(--glow-color);
    }

    .btn-save:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px var(--glow-color);
    }

    .btn-add-sched {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-pdf {
      background: var(--primary);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 15px var(--glow-color);
    }

    /* Filter bar with scrollbars and custom glowing day buttons */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      overflow-x: auto;
      padding-bottom: 0.6rem;
      -webkit-overflow-scrolling: touch;
      align-items: center;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--border-color);
    }
    .filter-bar::-webkit-scrollbar {
      height: 6px;
    }
    .filter-bar::-webkit-scrollbar-track {
      background: var(--card-bg);
      border-radius: 3px;
    }
    .filter-bar::-webkit-scrollbar-thumb {
      background-color: var(--primary);
      border-radius: 3px;
    }

    .filter-chip {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
    }

    .filter-chip.active, .filter-chip:hover, .filter-chip:focus-visible {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 14px var(--glow-color);
      outline: none;
    }

    /* Standout glow when pressed (Earth theme light olive glow, Matrix, Synthwave, Nordic, Love, Bubbly) */
    .filter-chip.pressed-glow, :root[data-theme="earthlings"] .filter-chip.active, :root[data-theme="matrix"] .filter-chip.active, :root[data-theme="synthwave"] .filter-chip.active, :root[data-theme="nordic"] .filter-chip.active, :root[data-theme="love"] .filter-chip.active, :root[data-theme="bubbly"] .filter-chip.active {
      box-shadow: 0 0 16px var(--glow-color);
      border-color: var(--primary);
      color: var(--lightest);
      background: var(--darker);
    }

    .day-delete-x {
      margin-left: 6px;
      font-size: 0.7rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: 50%;
    }
    .day-delete-x:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.85rem;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
      position: relative;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  box-shadow 0.25s ease,
                  border-color 0.25s ease;
      user-select: none;
    }

    .card:hover {
      transform: scale(1.02) translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 0 18px var(--glow-color);
      z-index: 25;
    }

    .card.pressed {
      transform: scale(1.04) translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 0 28px var(--glow-color), 0 0 10px var(--secondary);
      z-index: 30;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--primary);
      color: var(--primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .card-actions {
      display: flex;
      gap: 0.4rem;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .icon-btn:hover, .icon-btn:focus-visible, .icon-btn.active-edit {
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 8px var(--glow-color);
      outline: none;
    }

    .icon-btn-delete:hover, .icon-btn-delete:focus-visible {
      color: #ef4444 !important;
      border-color: #ef4444 !important;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6) !important;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: var(--text-main);
      line-height: 1.3;
    }

    .slots-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 2px dashed var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .slot-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .slot-row a {
      color: inherit;
      text-decoration: none;
    }

    .slot-row i {
      color: var(--primary);
      width: 16px;
      text-align: center;
    }

    /* Real-time active schedule indicator slot glow */
    .slot-row.active-realtime-slot {
      background: var(--darker);
      color: var(--lightest);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--primary);
      box-shadow: 0 0 12px var(--glow-color);
      font-weight: 700;
      order: -1; /* Goes from above the list */
    }
    .slot-row.active-realtime-slot i {
      color: var(--lightest);
    }

    .card-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.35s ease;
      opacity: 0;
      margin-top: 0;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.04);
      border-radius: 8px;
    }

    .card.pressed .card-details {
      max-height: 200px;
      opacity: 1;
      margin-top: 0.75rem;
      padding: 0.6rem 0.8rem;
      border: 1px dashed var(--primary);
    }

    [contenteditable="true"] {
      outline: 2px dashed var(--primary) !important;
      background: rgba(255, 255, 255, 0.08) !important;
      border-radius: 4px;
      padding: 2px 4px;
      cursor: text;
    }

    .add-slot-btn {
      display: none;
      width: 100%;
      margin-top: 5px;
      border: 1px dashed var(--primary);
      height: 28px;
    }

    .is-editing .add-slot-btn {
      display: flex;
    }

    footer.app-footer {
      text-align: center;
      margin-top: 2rem;
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border-color);
    }

    /* Themed Notification Toasts & Modal */
    #saveToast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--card-bg);
      color: var(--text-main);
      border: 2px solid var(--primary);
      box-shadow: 0 0 20px var(--glow-color);
      padding: 0.8rem 1.4rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 1000;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    #saveToast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* PDF Export Options Modal */
    .pdf-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.75);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .pdf-modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .pdf-modal-content {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      box-shadow: 0 0 30px var(--glow-color);
      border-radius: 16px;
      padding: 1.5rem;
      width: 90%;
      max-width: 600px;
      color: var(--text-main);
      max-height: 90vh;
      overflow-y: auto;
    }
    .pdf-modal-content h3 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
    }
    .pdf-option-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
    }
    .pdf-option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      cursor: pointer;
    }
    .pdf-option-item input {
      margin-top: 3px;
      accent-color: var(--primary);
    }

    @media (max-width: 768px) {
      body { padding: 0.75rem; }
      header { flex-direction: column; align-items: stretch; }
      .toolbar { justify-content: stretch; }
      .btn, select { flex: 1 1 auto; }
      .schedule-grid { grid-template-columns: 1fr; }
      #saveToast { bottom: 1rem; right: 1rem; left: 1rem; text-align: center; justify-content: center; }
    }

    @media print {
      #nodeCanvas, .toolbar, .filter-bar, #saveToast, .icon-btn, .pdf-modal-overlay { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .card { border: 1px solid #000 !important; box-shadow: none !important; transform: none !important; }
    }
  </style>
</head>
